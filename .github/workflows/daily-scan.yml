name: daily-scan
on:
  schedule:
    - cron: "30 8 * * 1-5"   # 16:30 北京时间，A股/港股收盘后
    - cron: "30 21 * * 1-5"  # 05:30 北京时间，美股收盘后
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: scan watchlist
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: python -m btq alert --watchlist watchlist.txt --webhook "$WEBHOOK"
