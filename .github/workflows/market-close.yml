name: market-close
# 每个市场收盘后：拉行情 → 四证判定 → 生成首屏结论和详情 → 发布到 gh-pages 分支（GitHub Pages）
# 推送：网页 ⚙ 设置 → 收盘推送 会写仓库变量 ALERT_WEBHOOK / ALERT_LEVELS；也可手动建 secret ALERT_WEBHOOK（飞书/钉钉/企业微信机器人）
on:
  schedule:
    # GitHub 的定时任务是“尽力而为”，高峰期会延迟或直接丢弃，所以每个收盘点后再补两次；同一批信号只推送一次
    - cron: "37 7,8 * * 1-5"      # 15:37 / 16:37 北京时间，A股、港股收盘后
    - cron: "13 8,9 * * 1-5"      # 16:13 / 17:13 补跑
    - cron: "37 21 * * 1-5"       # 05:37 北京时间，美股收盘后（周二到周六早上）
    - cron: "13 22,23 * * 1-5"    # 06:13 / 07:13 补跑
  workflow_dispatch:
    inputs:
      test_push: { description: "发送一条测试推送", type: boolean, default: false }
  push:
    branches: [main]
    paths: ["btq/**", "scripts/**", "markets.yaml", "configs/**", ".github/workflows/market-close.yml"]
permissions:
  contents: write
concurrency: { group: market-close, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { TZ: Asia/Shanghai }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt httpx akshare
      - name: build site
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK || vars.ALERT_WEBHOOK }}
          LEVELS: ${{ vars.ALERT_LEVELS || '入场,离场,减仓' }}
          TEST_PUSH: ${{ inputs.test_push && '--test-push' || '' }}
        run: python scripts/build_site.py --out site --webhook "$WEBHOOK" --levels "$LEVELS" --site-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" $TEST_PUSH
      - name: publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "收盘结论"
