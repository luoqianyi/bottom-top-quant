name: market-close
# 每个市场收盘后：拉行情 → 四证判定 → 生成首屏结论和详情 → 发布到 gh-pages 分支（GitHub Pages）
# 推送：网页 ⚙ 设置 → 收盘推送 会写仓库变量 ALERT_WEBHOOK / ALERT_LEVELS；也可手动建 secret ALERT_WEBHOOK（飞书/钉钉/企业微信机器人）
on:
  schedule:
    # GitHub 的定时任务是“尽力而为”，新仓库经常整段丢弃；另由外部定时改写 .github/trigger.txt 推送触发（主力），这里只是备用。同一个收盘点只推送一次
    - cron: "25 8 * * 1-5"        # 16:25 北京时间，A股、港股都收盘后
    - cron: "55 8,9 * * 1-5"      # 16:55 / 17:55 补跑
    - cron: "37 21 * * 1-5"       # 05:37 北京时间，美股收盘后（周二到周六早上）
    - cron: "13 22,23 * * 1-5"    # 06:13 / 07:13 补跑
  workflow_dispatch:
    inputs:
      test_push: { description: "发送一条测试推送", type: boolean, default: false }
  push:
    branches: [main]
    paths: ["btq/**", "scripts/**", "markets.yaml", "configs/**", ".github/workflows/market-close.yml", ".github/trigger.txt"]
permissions:
  contents: write
concurrency: { group: market-close, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { TZ: Asia/Shanghai }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt httpx akshare
      - name: build site
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK || vars.ALERT_WEBHOOK }}
          LEVELS: ${{ vars.ALERT_LEVELS || '入场,离场,减仓' }}
          TEST_PUSH: ${{ inputs.test_push && '--test-push' || '' }}
        # 数据源的原生库偶尔崩溃（退出码 133），失败就隔 30 秒再跑一次
        run: |
          ARGS=(--out site --webhook "$WEBHOOK" --levels "$LEVELS" --site-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" $TEST_PUSH)
          python scripts/build_site.py "${ARGS[@]}" || { echo "retry in 30s"; sleep 30; python scripts/build_site.py "${ARGS[@]}"; }
      - name: publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "收盘结论"
