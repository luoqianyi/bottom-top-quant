<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f0d0b" />
<title>btq · 收盘结论</title>
<link rel="stylesheet" href="static/overview.css" />
</head>
<body>
<div class="ticker" id="ticker"><div class="track" id="track"></div></div>
<header class="head">
  <div class="brand"><span class="logo">◈</span><b>收盘结论</b><span class="model" id="model"></span></div>
  <div class="asof" id="asof"></div>
  <button class="st-gear" id="refreshBtn" title="获取实时行情（不触发 Actions）">⟳ 更新数据</button><span class="rf-msg" id="refreshMsg"></span>
  <button class="st-gear" data-settings>⚙ 设置</button>
</header>
<nav class="filters" id="filters">
  <button data-f="all" class="on">全部</button>
  <button data-f="入场" class="go">入场 <i id="c入场">0</i></button>
  <button data-f="离场" class="stop">离场 <i id="c离场">0</i></button>
  <button data-f="减仓" class="warn">减仓 <i id="c减仓">0</i></button>
  <button data-f="关注" class="wait">关注 <i id="c关注">0</i></button>
  <button data-f="观望" class="idle">观望 <i id="c观望">0</i></button>
</nav>
<main id="groups"><div class="loading"><span class="spin"></span>正在汇总各市场收盘…</div></main>
<footer class="foot">
  <div>四证抄底 / 四证逃顶规则模型 · 每个市场收盘后自动更新 · 点色块看详情</div>
  <div>内容仅作研究学习，不构成投资建议</div>
</footer>
<script src="static/settings.js"></script>
<script src="static/overview.js"></script>
</body>
</html>
